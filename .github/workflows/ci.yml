name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Серверная часть — типы и сборка
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Зависимости
        working-directory: backend
        run: npm ci --include=dev

      - name: Проверка типов
        working-directory: backend
        run: npx tsc --noEmit

      - name: Сборка
        working-directory: backend
        run: npm run build

  frontend:
    name: Интерфейс — типы и сборка
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависимости
        working-directory: frontend
        run: npm ci --include=dev

      - name: Проверка типов
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Сборка
        working-directory: frontend
        run: npm run cb
